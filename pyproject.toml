[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrust"
description = "Run Python at native speed where possible, and as plain Python everywhere else."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["python", "rust", "compiler", "transpiler", "performance", "jit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Compilers",
]
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]

[project.scripts]
pyrust = "pyrust.cli:main"

[tool.setuptools]
packages = ["pyrust"]

[tool.setuptools.dynamic]
version = { attr = "pyrust.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
